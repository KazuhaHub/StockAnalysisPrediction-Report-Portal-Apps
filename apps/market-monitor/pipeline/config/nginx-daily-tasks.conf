# 日更看板的 nginx 站点（HTTP 版）
#
# 安装：install.sh 会自动拷贝到 /etc/nginx/conf.d/daily-tasks.conf
# 手动：sudo cp config/nginx-daily-tasks.conf /etc/nginx/conf.d/ && sudo nginx -t && sudo systemctl reload nginx
#
# 这些页面含持仓与选股结论，默认建议只在内网或加 basic auth 后访问。

server {
    listen       80;
    server_name  _;

    root  /opt/daily-tasks/web;
    index index.html;

    charset utf-8;
    autoindex off;

    # 单文件 HTML 有 4~5 MB（echarts 内联在里面），开 gzip 传输能省一多半
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/html text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # ---- 需要口令时取消下面注释，先建口令文件：----
    # sudo apt install apache2-utils -y
    # sudo htpasswd -c /etc/nginx/.htpasswd weifei
    # auth_basic           "daily reports";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    access_log /var/log/nginx/daily-tasks.access.log;
    error_log  /var/log/nginx/daily-tasks.error.log;
}
