# Include inside the HTTPS Portal server block. Replace status-service:8791 with
# the independently deployed Status backend. Do not add a broad /status/ proxy.
location = /status { return 308 /status/; }
location = /status/ {
    proxy_pass http://status-service:8791/;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}
location = /status/app.js {
    proxy_pass http://status-service:8791/app.js;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
}
location = /status/style.css {
    proxy_pass http://status-service:8791/style.css;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
}
location = /status/public/v1/status {
    proxy_pass http://status-service:8791/public/v1/status;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}
location = /status/public/v1/incidents {
    proxy_pass http://status-service:8791/public/v1/incidents;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}
location /status/ { return 404; }
