name: Release Status
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact non-development Status manifest version
        type: string
        required: true
      confirmation:
        description: Repeat the exact status/vVERSION tag
        type: string
        required: true
      notes:
        description: Reader-facing release notes
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: status-release
  cancel-in-progress: false
env:
  GOWORK: 'off'
  GOTOOLCHAIN: local
  RELEASE_NOTES: ${{ inputs.notes }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/status/service/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require source acceptance and download the released Portal
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: python3 scripts/status-publish.py prepare --version "$VERSION" --confirmation "$CONFIRMATION" --output "$RUNNER_TEMP/release-bundle"
      - name: Build all six immutable artifact candidates
        run: python3 scripts/build-status-release.py --output "$RUNNER_TEMP/release-bundle/artifacts"
      - name: Verify provenance and native executable identity
        env:
          VERSION: ${{ inputs.version }}
        run: |
          artifacts="$RUNNER_TEMP/release-bundle/artifacts/status/$VERSION"
          python3 scripts/status-publish.py verify --plan "$RUNNER_TEMP/release-bundle/plan.json" --artifacts "$artifacts"
          tar -xzf "$artifacts/status-v$VERSION-linux-amd64.tar.gz" -C "$RUNNER_TEMP/release-bundle"
          test "$("$RUNNER_TEMP/release-bundle/status" version)" = "$VERSION"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP']) / 'release-bundle'
          plan = json.loads((folder / 'plan.json').read_text())
          actual = subprocess.check_output([str(folder / 'report-portal'), 'version'], text=True).strip()
          if not actual.startswith(plan['minimum_portal_release'].removeprefix('v') + ' ('):
              raise SystemExit('Released Portal executable identity mismatch')
          PY
      - name: Test real notification capture against the released Portal
        working-directory: apps/status/service
        env:
          PORTAL_BINARY: ${{ runner.temp }}/release-bundle/report-portal
        run: go test -race ./internal/status -run '^TestPortalNotificationCaptureAndChannelQuota$' -count=1
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: apps/status/tests
      - name: Browser acceptance against released Portal and packaged service
        working-directory: apps/status/tests
        env:
          PORTAL_BINARY: ${{ runner.temp }}/release-bundle/report-portal
          STATUS_BINARY: ${{ runner.temp }}/release-bundle/status
          RP_DB_DRIVER: postgres
          RP_DB_DSN: fixture-must-not-be-used
          RP_LISTEN: invalid-fixture-listen
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: status-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle/
          retention-days: 14
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: status-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle
      - name: Recheck reviewed source before registry writes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/status-publish.py verify-source --plan "$RUNNER_TEMP/release-bundle/plan.json"
          python3 scripts/status-publish.py image-context --plan "$RUNNER_TEMP/release-bundle/plan.json" --artifacts "$RUNNER_TEMP/release-bundle/artifacts/status/$VERSION" --output "$RUNNER_TEMP/image-context"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release-bundle/plan.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('STATUS_IMAGE=' + plan['image'] + '\n')
              stream.write('STATUS_RUNTIME=' + plan['runtime_image'] + '\n')
          PY
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Refuse an existing image version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/status-publish.py image-absent --plan "$RUNNER_TEMP/release-bundle/plan.json"
      - name: Publish the verified prebuilt executables
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/image-context
          platforms: linux/amd64,linux/arm64
          build-args: RUNTIME_IMAGE=${{ env.STATUS_RUNTIME }}
          tags: ${{ env.STATUS_IMAGE }}
          push: true
      - name: Verify both image executables against the archives
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          reference="${STATUS_IMAGE%:*}@$DIGEST"
          for arch in amd64 arm64; do
            docker pull --platform "linux/$arch" "$reference"
            id=$(docker create --platform "linux/$arch" "$reference")
            docker cp "$id:/status" "$RUNNER_TEMP/image-status-$arch"
            docker rm "$id"
            cmp "$RUNNER_TEMP/image-status-$arch" "$RUNNER_TEMP/image-context/linux-$arch/status"
          done
          test "$(docker run --rm --pull always --platform linux/amd64 "$reference" version)" = "$VERSION"
      - name: Bind image digest, upload and verify draft assets, then publish
        env:
          VERSION: ${{ inputs.version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          artifacts="$RUNNER_TEMP/release-bundle/artifacts/status/$VERSION"
          python3 scripts/status-publish.py finalize --plan "$RUNNER_TEMP/release-bundle/plan.json" --artifacts "$artifacts"
          python3 scripts/status-publish.py publish --plan "$RUNNER_TEMP/release-bundle/plan.json" --artifacts "$artifacts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: status-publication-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle/
          retention-days: 30
          if-no-files-found: error
