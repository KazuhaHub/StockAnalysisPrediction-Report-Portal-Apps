name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 scripts/catalogue.py check
      - run: python3 scripts/catalogue.py package demo-symbols
  protocol:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/extensionprotocol
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/extensionprotocol/go.mod
          cache: false
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go test -race ./...
